name: Flake update

on:
  schedule:
    - cron: '0 5 * * 1'   # lunedì 05:00 UTC (07:00 Europe/Rome con CEST)
  workflow_dispatch:

concurrency:
  group: flake-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  flake-update:
    name: nix flake update -> PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # install-nix-action v31 abilita di suo "nix-command flakes" (lo aggiunge solo
      # se extra_nix_config non lo contiene già): nessun extra_nix_config da passare.
      - uses: cachix/install-nix-action@v31

      - name: nix flake update
        run: nix flake update

      - name: Rileva modifiche a flake.lock
        id: diff
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "flake.lock già aggiornato, nessuna PR"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff flake.lock > /tmp/flake.lock.diff
          fi

      # Verifiche inline: una PR creata con GITHUB_TOKEN non "salta" ci.yml, ma il
      # relativo run su pull_request nasce in stato approval-required (banner
      # "Approve workflows to run" nel merge box) finché un utente con write access
      # non lo approva. Questi due comandi restano quindi l'unico gate non assistito.
      - name: Verifiche (stessi comandi di ci.yml)
        if: steps.diff.outputs.changed == 'true'
        run: |
          nix flake check --all-systems
          nix eval .#nixosConfigurations.nebula.config.system.build.toplevel.drvPath --raw

      - name: Branch, commit e PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/body.md << 'EOF'
          Aggiornamento settimanale di `flake.lock` (`nix flake update`).

          Verifiche già eseguite in questa run, identiche a `ci.yml`:
          - `nix flake check --all-systems`
          - `nix eval .#nixosConfigurations.nebula.config.system.build.toplevel.drvPath`

          Technitium (`nixpkgs-unstable`) e beszel-agent (`nixpkgs`) seguono questi input: un loro aggiornamento appare qui come cambio di rev.

          ```diff
          EOF
          cat /tmp/flake.lock.diff >> /tmp/body.md
          echo '```' >> /tmp/body.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c chore/flake-update
          git commit -am 'chore(nix): flake update automatico'
          git push --force origin HEAD:refs/heads/chore/flake-update

          # L'uscita di gh va controllata: se la query fallisce (rate limit, rete) il
          # command substitution darebbe stringa vuota, il test [ "" = "0" ] sarebbe
          # falso e la PR verrebbe saltata in silenzio con run verde.
          open_prs=$(gh pr list --head chore/flake-update --state open --json number --jq 'length') || exit 1
          if [ "$open_prs" = "0" ]; then
            gh pr create --base main --head chore/flake-update \
              --title 'chore(nix): flake update automatico' \
              --body-file /tmp/body.md
          fi
