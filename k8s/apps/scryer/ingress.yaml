apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scryer
  namespace: scryer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - scryer.lab.paroparo.it
      # Traefik usa il wildcard di default (wildcard-lab-paroparo-it-tls da kube-system)
  rules:
    - host: scryer.lab.paroparo.it
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scryer
                port:
                  number: 8080
