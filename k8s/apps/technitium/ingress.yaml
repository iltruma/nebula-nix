apiVersion: v1
kind: Service
metadata:
  name: technitium-web
  namespace: infra-proxy
spec:
  ports:
    - port: 5380
      targetPort: 5380
---
apiVersion: v1
kind: Endpoints
metadata:
  name: technitium-web
  namespace: infra-proxy
subsets:
  # Technitium è un servizio HOST NixOS (non un pod k8s), gira su
  # 10.0.40.2:5380. Traefik (pod in kube-system) lo raggiunge via cni0:
  # kube-router accetta il traffico pod→host in INPUT prima di nixos-fw.
  - addresses:
      - ip: 10.0.40.2
    ports:
      - port: 5380
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: technitium-web
  namespace: infra-proxy
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: http
spec:
  ingressClassName: traefik
  tls:
    - hosts:
      # wildcard via TLSStore default (kube-system): il secret cross-namespace
      # non è risolvibile da una Ingress in infra-proxy (come negli altri ingress).
  rules:
    - host: dns.lab.paroparo.it
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: technitium-web
                port:
                  number: 5380
