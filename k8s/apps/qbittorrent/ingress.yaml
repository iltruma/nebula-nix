apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - qbittorrent.lab.paroparo.it
      # Traefik usa il wildcard di default (wildcard-lab-paroparo-it-tls da kube-system)
  rules:
    - host: qbittorrent.lab.paroparo.it
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080
